[workspace]
resolver = "2"

members = [
    "crates/aria-contracts",
    "crates/aria-foundation-engine",
    "crates/aria-storage-engine",
    "crates/aria-security-engine",
    "crates/aria-schema-engine",
    "crates/aria-domain-engine",
    "crates/aria-plugin-engine",
    "crates/aria-runtime-engine",
    "crates/aria-query-engine",
    "crates/aria-ui-engine",
    "apps/tahan-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parsidate = { version = "1.7", features = ["serde"] }
dirs = "7"
semver = "1.0"
